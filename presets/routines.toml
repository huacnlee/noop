# Optional routines for software teams. Copy the ones you need into config.toml.
# Agents referenced here live in presets/agents/; copy them into your data folder's agents/ too.

[[routine]]
name = "triage-inbound"
every = "60m"
agent = "dispatcher"
prompt = """Scan inbound signals since the last journal entry by dispatcher: GitHub notifications (gh api notifications),
PRs requesting my review, issues assigned to me, CI failures on my open PRs, new uptime alerts.
Dedupe against tasks/ and journal/, then emit follow-ups routed to the right agent. Mark handled notifications read."""

[[routine]]
name = "uptime-watch"
readonly = true                       # only observes: runs without approval; changes come back as gated followups
every = "10m"
agent = "ops-watcher"
priority = "high"
prompt = "Check the uptime alert source listed in memory/projects.md. Apply your escalation rules."

[[routine]]
name = "pr-review"
signal = """gh api graphql -f query='query($q:String!){search(query:$q,type:ISSUE,first:100){nodes{... on PullRequest{url headRefOid reviewDecision commits(last:1){nodes{commit{statusCheckRollup{state}}}}}}}}' -f q='is:pr is:open repo:owner/app' --jq '[.data.search.nodes[]|.url+" "+.headRefOid+" "+(.commits.nodes[0].commit.statusCheckRollup.state//"-")+" "+(.reviewDecision//"-")]|sort'"""   # head SHA + check conclusion + review state; updatedAt would fire on every CI tick
every = "30m"
agent = "reviewer"
requires = "os:linux"
prompt = """Find open PRs on the Core repos in memory/projects.md
whose current head SHA is not in reviews/ (ledger), oldest first, PRs by others before my own. Review & verify up to 3 of them in parallel
(one subagent + worktree + visual session each) per your profile."""

[[routine]]
name = "own-prs-ci"
signal = """gh api graphql -f query='query($q:String!){search(query:$q,type:ISSUE,first:100){nodes{... on PullRequest{url headRefOid reviewDecision commits(last:1){nodes{commit{statusCheckRollup{state}}}}}}}}' -f q='is:pr is:open author:@me' --jq '[.data.search.nodes[]|.url+" "+.headRefOid+" "+(.commits.nodes[0].commit.statusCheckRollup.state//"-")+" "+(.reviewDecision//"-")]|sort'"""   # head SHA + check conclusion + review state; updatedAt would fire on every CI tick
readonly = true                       # only observes: runs without approval; changes come back as gated followups
every = "30m"
agent = "rust-maintainer"
prompt = """Find which of the owner's own open PRs are not mergeable and return one follow-up per PR that needs work. List them with `gh search prs --author=@me --state=open --json repository,number,url` and, per PR, `gh pr view <n> -R <repo> --json mergeable,mergeStateStatus,statusCheckRollup,reviewDecision,headRefName`.
Each follow-up names the PR URL, what is wrong and the exact fix, with difficulty "hard" when the fix needs real engineering:
1. mergeable == CONFLICTING (GitHub shows "This branch has conflicts", checks stuck "awaiting conflict resolution"): list the conflicting files. The fix: in a fresh worktree of the PR branch, `git merge origin/<base>` (never rebase: force-push is forbidden), resolve every conflict preserving the PR's intent and main's newer changes (read both sides' commits), run the repo's real build + tests (cargo test / bun test etc.), then push normally to the PR branch and comment a short signed note listing the resolved files.
2. CI red because of main drift, or a trivial failure (fmt, clippy, snapshot, lockfile): name the failing check and its cause; the fix goes on the branch the same way.
3. Unaddressed review comments with an obvious fix: quote them and give the fix.
If a conflict needs a product/design choice the code can't settle, say so in its follow-up with both versions summarized and a recommendation. Skip PRs marked draft-WIP by the owner within the last hour (he is likely still pushing). Nothing needs work → done with a one-line count."""

[[routine]]
name = "nightly-health"
readonly = true                       # only observes: runs without approval; changes come back as gated followups
every = "daily 02:30"
agent = "rust-maintainer"
requires = "os:linux"
weight = "heavy"
prompt = "In each Core repo of memory/projects.md: git fetch, run cargo check/test on latest main. File follow-ups for regressions."

[[routine]]
name = "macos-check"
readonly = true                       # only observes: runs without approval; changes come back as gated followups
every = "daily 10:00"
agent = "rust-maintainer"
prefer = "os:macos"
prompt = "Build and run tests of the Core repos on this host's OS (prefer macOS). Report platform-specific failures as follow-ups."

